<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Desktop</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- connect-src 必须放行后端基址，否则 default-src 'self' 会把渲染层的所有跨域请求掐掉；
         %RENDERER_VITE_API_BASE_URL% 由 Vite 在构建期按 env 替换，留空时只剩 'self' -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' %RENDERER_VITE_API_BASE_URL%"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
